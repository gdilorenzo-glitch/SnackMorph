[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "snackmorph-research"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "opencv-python-headless", "scikit-image", "scikit-learn", "matplotlib", "statsmodels", "patsy", "openpyxl", "tifffile"]
license = "MIT"
license-files = ["LICENSE.txt"]
[project.optional-dependencies]
fast = ["edt", "SimpleITK"]
test = ["pytest"]
[tool.setuptools.packages.find]
where = ["src"]
